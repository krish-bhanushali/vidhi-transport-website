name: Build and publish GitHub Pages preview
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Preview lives under /vidhi-transport-website/ and is noindex. The production
      # build (no BASE_PATH) is what gets uploaded to public_html.
      - name: Build static site (preview base path)
        run: npm run build
        env:
          BASE_PATH: /vidhi-transport-website/
      - name: Release-gate checks
        run: npm run check
        env:
          BASE_PATH: /vidhi-transport-website/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: publish
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
